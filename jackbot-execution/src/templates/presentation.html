<!DOCTYPE html>
<html>
<head>
    <title>JackBot Performance Presentation</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        .slide { width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .slide h1 { font-size: 3em; color: #2c3e50; margin-bottom: 20px; }
        .slide h2 { font-size: 2em; color: #34495e; }
        .highlight { color: #e74c3c; font-weight: bold; }
        .metrics { font-size: 1.5em; line-height: 2; }
    </style>
</head>
<body>
    <div class="slide">
        <h1>JackBot Performance Report</h1>
        <h2>Bloomberg Terminal Killer</h2>
    </div>
    <div class="slide">
        <h1>Key Metrics</h1>
        <div class="metrics">
            <p>Latency: <span class="highlight">{{latency}}</span></p>
            <p>Throughput: <span class="highlight">{{throughput}}</span></p>
            <p>Reliability: <span class="highlight">{{reliability}}</span></p>
        </div>
    </div>
</body>
</html>
