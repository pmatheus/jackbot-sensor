<!DOCTYPE html>
<html>
<head>
    <title>Executive Summary - JackBot Performance Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        h1 { color: #2c3e50; }
        .metric { padding: 10px; margin: 10px 0; background: #f8f9fa; }
        .highlight { color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Executive Summary</h1>
    <div class="metric">
        <h2>Performance Highlights</h2>
        <p>Latency: <span class="highlight">{{latency_p50}}</span></p>
        <p>Throughput: <span class="highlight">{{throughput}}</span></p>
        <p>Success Rate: <span class="highlight">{{success_rate}}</span></p>
    </div>
</body>
</html>
