global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Sensor metrics
  - job_name: 'jackbot-sensor'
    static_configs:
      - targets: ['host.docker.internal:9464']  # Sensor metrics endpoint
    metrics_path: '/metrics'

  # Kafka metrics
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9308']
    metrics_path: '/metrics'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']