version: '3.8'

services:
  # Kafka for real-time streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: jackbot-sensor-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - jackbot-sensor-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: jackbot-sensor-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_COMPRESSION_TYPE: 'zstd'
    networks:
      - jackbot-sensor-network

  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    container_name: jackbot-sensor-redis
    command: redis-server --requirepass jackbot_sensor_redis_password --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"  # Different port to avoid conflict with backend
    volumes:
      - redis-data:/data
    networks:
      - jackbot-sensor-network

  # PostgreSQL for sensor configuration and state
  postgres:
    image: postgres:16-alpine
    container_name: jackbot-sensor-postgres
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: sensor_password
      POSTGRES_DB: jackbot_sensor
    ports:
      - "5434:5432"  # Different port to avoid conflict with backend
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jackbot-sensor-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: jackbot-sensor-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9091:9090"  # Different port to avoid conflict
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - jackbot-sensor-network

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: jackbot-sensor-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"  # Different port to avoid conflict
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - jackbot-sensor-network

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: jackbot-sensor-kafka-ui
    ports:
      - "8081:8080"  # Different port to avoid conflict
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - jackbot-sensor-network

networks:
  jackbot-sensor-network:
    name: jackbot-sensor-network
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data: