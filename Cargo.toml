[workspace]
members = [
    "jackbot-data",
    "jackbot-execution", 
    "jackbot-risk",
    "jackbot-integration",
    "jackbot-instrument",
    "jackbot-macro",
    "jackbot-ta",
    # "jackbot",  # Temporarily disabled - has missing dependencies
]
resolver = "2"

[workspace.lints]
rust.unused_crate_dependencies = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1.17"
futures = "0.3.31"
futures-util = "0.3.31"
async-trait = "0.1.83"
pin-project = "1.1"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.133"
chrono = { version = "0.4.39", features = ["serde"] }

# Error handling
thiserror = "2.0.8"
anyhow = "1.0"

# Data structures
rust_decimal = { version = "1.36.0", features = ["maths", "serde"] }
rust_decimal_macros = "1.36.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
dashmap = "6.0"
parking_lot = "0.12.3"
indexmap = "2.6.0"
smol_str = { version = "0.3", features = ["serde"] }
fnv = "1.0"
derive_more = { version = "1.0", features = ["display", "from", "constructor"] }
itertools = "0.13"
vecmap-rs = "0.2"

# Network and WebSocket
tokio-tungstenite = { version = "0.26.0", features = ["url", "rustls-tls-webpki-roots"] }
tungstenite = "0.26.0"
url = "2.5.0"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json"] }

# Utilities
once_cell = "1.20"
rand = "0.8.5"
spin_sleep = "1.2"
num-traits = "0.2"

# Jackbot Ecosystem
jackbot-integration = { path = "./jackbot-integration" }
jackbot-instrument = { path = "./jackbot-instrument" }
jackbot-data = { path = "./jackbot-data" }
jackbot-execution = { path = "./jackbot-execution" }
jackbot-risk = { path = "./jackbot-risk" }
jackbot-ta = { path = "./jackbot-ta" }
jackbot = { path = "./jackbot" }
jackbot-macro = { path = "./jackbot-macro" }

[package]
name = "jackbot-sensor"
version = "1.0.0"
edition = "2024"
description = "Comprehensive cryptocurrency trading sensor system"
license = "MIT"

# Sensor binary
[[bin]]
name = "jackbot-sensor"
path = "src/main.rs"

# Kafka streaming binary
[[bin]]
name = "jackbot-kafka-streamer"
path = "src/bin/jackbot-sensor.rs"

[dependencies]
# Core Jackbot modules
jackbot-data = { workspace = true }
jackbot-execution = { workspace = true }
jackbot-risk = { workspace = true }
jackbot-instrument = { workspace = true }
jackbot-integration = { workspace = true }
# jackbot = { workspace = true }  # Temporarily disabled - has missing dependencies

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }

# Logging and observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI interface
clap = { version = "4.4", features = ["derive", "env"] }

# Configuration
config = "0.14"
toml = "0.8"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Environment variables
dotenv = "0.15"

# TLS support
tokio-tungstenite = { workspace = true }

# HTTP server for APIs
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Utilities
once_cell = { workspace = true }

# Data structures
indexmap = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
crossbeam-skiplist = "0.1"
crossbeam-channel = "0.5"
parking_lot = { workspace = true }
async-stream = "0.3"

# Kafka for real-time streaming
rdkafka = { version = "0.36", features = ["tokio"] }

# Protocol Buffers for message serialization
prost = "0.12"
prost-types = "0.12"

# AWS S3 for data lake storage
aws-sdk-s3 = "1.20.0"

# AWS SDK for deployment
aws-config = "1.1"
aws-sdk-ec2 = "1.15"
aws-sdk-ecs = "1.12"

# Metrics and monitoring
prometheus = "0.13"

# Rate limiting
governor = "0.6"

# Redis for high-performance caching
deadpool-redis = "0.18"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Efficient binary serialization
bincode = "1.3"

# Cryptographic hashing for security tokens
crypto-hash = "0.3"

# Regex for validation
regex = "1.10"

# JSON Web Tokens
jsonwebtoken = "9.2"

# HTTP client for JWKS
reqwest = { workspace = true }

# Base64 encoding for JWT parsing
base64 = "0.22.1"

# CPU affinity and performance optimization
core_affinity = "0.8"
num_cpus = "1.16"
libc = "0.2"

# Additional dependencies for the sensor
url = { workspace = true }
rand = { workspace = true }

# Cryptographic libraries for exchange authentication
hmac = "0.12"
sha2 = "0.10"

# Performance optimization
smallvec = "1.13"
rustc-hash = "2.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "winbase"] }

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
tempfile = "3.8"
proptest = "1.4"
tokio-test = "0.4.4"
wiremock = "0.6"
test-log = "0.2"
serial_test = "3.1"