[package]
name = "jackbot-data"
version = "0.10.1"
edition = "2024"
authors = ["Jack <mail@jackbot.app>"]
license = "MIT"
documentation = "https://docs.rs/jackbot-data"
repository = "https://github.com/jackbot-rs/jackbot-rs"
readme = "README.md"
description = "High performance & normalised WebSocket intergration for leading cryptocurrency exchanges - batteries included."
keywords = ["trading", "backtesting", "crypto", "stocks", "investment"]
categories = ["accessibility", "simulation"]

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
rust_decimal_macros = { workspace = true }
# criterion = { version = "0.5.1", features = ["html_reports"] }  # Used for benchmarks

# [[bench]]
# name = "performance_benchmarks"
# harness = false

[dependencies]
# Jackbot Ecosystem
jackbot-integration = { workspace = true }
jackbot-instrument = { workspace = true }
jackbot-macro = { workspace = true }

# Logging
tracing = { workspace = true }

# Async
tokio = { workspace = true, features = ["sync", "macros", "rt-multi-thread", "test-util"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
tokio-tungstenite = { workspace = true }

# Protocol
url = { workspace = true }
reqwest = { workspace = true}

# Error
thiserror = { workspace = true }

# SerDe
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Kafka interaction
# kafka = { workspace = true } # Temporarily disabled

# Data Structures
parking_lot = { workspace = true }
rust_decimal = { workspace = true, features = ["serde-with-str"] }
smol_str = { workspace = true, features = ["serde"] }

# Misc
chrono = { workspace = true, features = ["serde"] }
derive_more = { workspace = true }
itertools = { workspace = true }
vecmap-rs = { workspace = true }
fnv = { workspace = true }

# High-performance optimization dependencies
# crossbeam = "0.8"  # Currently unused
rayon = "1.10"
num_cpus = "1.16"
