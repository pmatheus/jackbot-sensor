# Jackbot Sensor Configuration

[sensor]
# Instance configuration
instance_id = "sensor-dev-01"
environment = "development"
log_level = "info"

# Performance settings
max_concurrent_connections = 100
websocket_buffer_size = 65536
order_book_depth = 100

[data]
# Kafka configuration
[data.message_broker]
brokers = ["localhost:9092"]
producer_config = { "compression.type" = "zstd", "linger.ms" = "10" }
consumer_config = { "group.id" = "jackbot-sensor", "auto.offset.reset" = "latest" }

# Redis configuration
[data.cache]
url = "redis://:jackbot_sensor_redis_password@localhost:6380"
pool_size = 10
ttl_seconds = 300

# PostgreSQL configuration
[data.database]
url = "postgresql://sensor:sensor_password@localhost:5434/jackbot_sensor"
max_connections = 10

# Exchange configurations
[exchanges.binance]
enabled = true
testnet = true
ws_url = "wss://testnet.binance.vision/ws"
rest_url = "https://testnet.binance.vision/api"
rate_limit_requests_per_second = 20
rate_limit_buffer = 0.8
symbols = ["BTCUSDT", "ETHUSDT", "BNBUSDT"]

